version: "3.9"

services:
  frontend:
    build:
      target: dev                  # multi-stage: use dev stage, not prod
    volumes:
      - ./frontend:/app            # mount source for Vite HMR
      - /app/node_modules          # don't overwrite container's node_modules
    ports:
      - "5173:5173"               # Vite dev server port
    command: npm run dev -- --host 0.0.0.0

  backend:
    volumes:
      - ./backend:/app            # mount source for uvicorn --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development

  ai_server:
    volumes:
      - ./ai_server/app:/app/app  # mount app code only, not models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload